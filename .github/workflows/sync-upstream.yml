# 自动跟踪上游 maillab/cloud-mail 的 release：拉取指定版本源码 → pnpm 构建 → wrangler 部署 → 数据库升级 → 校验。
# 不需要镜像上游代码，也不需要 PAT：直接用本仓库的 GITHUB_TOKEN（只推 tag 作为状态标记）。
# 状态标记：tag `deployed-<版本>`，表示该版本已成功上线；没有新版本时整个流程空跑。
# 安全网：升级前用 Cloudflare D1 Time Travel 回滚（wrangler d1 time-travel restore dqdd --bookmark <id>）。
name: 🚀 自动升级 cloud-mail

on:
  schedule:
    - cron: "0 19 * * *"   # 每天北京时间 03:00，收信低峰
  workflow_dispatch:
    inputs:
      tag:
        description: "指定上游版本（留空 = 最新 release）"
        required: false
        default: ""
      skip_deploy:
        description: "只解析版本不部署（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: cloud-mail-upgrade
  cancel-in-progress: false

env:
  UPSTREAM: maillab/cloud-mail
  SITE: https://m.dqdd.de

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: 解析目标版本
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          if [ -z "$TAG" ]; then
            echo "拿不到上游版本号"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "目标版本：$TAG"

      - name: 判断是否已上线
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          REFS=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/deployed-" --jq '[.[].ref | sub("^refs/tags/deployed-"; "")] | join(" ")')
          DEPLOYED=$(printf '%s\n' $REFS | sort -V | tail -1)
          echo "当前已上线：${DEPLOYED:-无}"
          if [ "$TAG" = "$DEPLOYED" ]; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "已是最新，本次不部署。"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取上游源码
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        uses: actions/checkout@v4
        with:
          repository: maillab/cloud-mail
          ref: ${{ steps.up.outputs.tag }}
          path: src
          fetch-depth: 1

      - name: 设置 pnpm
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: 设置 Node.js
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 worker 依赖
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        working-directory: ./src/mail-worker
        run: pnpm install --frozen-lockfile

      - name: 生成部署配置
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        working-directory: ./src/mail-worker
        env:
          NAME: ${{ vars.NAME }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          DOMAIN: ${{ vars.DOMAIN }}
          ADMIN: ${{ secrets.ADMIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ANALYSIS_CACHE: ${{ vars.ANALYSIS_CACHE }}
        run: |
          cp wrangler-action.toml wrangler-deploy.toml
          sed -i '/^\[\[send_email\]\]/,/^$/d' wrangler-deploy.toml
          sed -i '/^project_link = /d' wrangler-deploy.toml
          sed -i "s|\${NAME}|${NAME}|g" wrangler-deploy.toml
          sed -i "s|\${CUSTOM_DOMAIN}|${CUSTOM_DOMAIN}|g" wrangler-deploy.toml
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" wrangler-deploy.toml
          sed -i "s|\${ADMIN}|${ADMIN}|g" wrangler-deploy.toml
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g" wrangler-deploy.toml
          sed -i "s|\${R2_BUCKET_NAME}|${R2_BUCKET_NAME}|g" wrangler-deploy.toml
          sed -i "s|\${ANALYSIS_CACHE}|${ANALYSIS_CACHE}|g" wrangler-deploy.toml
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" wrangler-deploy.toml
          sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" wrangler-deploy.toml
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" wrangler-deploy.toml
          sed -i "s|\${PROJECT_LINK}|/|g" wrangler-deploy.toml
          echo "=== 部署配置（敏感字段已隐藏） ==="
          sed -E 's/(jwt_secret|admin) = .*/\1 = (***)/' wrangler-deploy.toml

      - name: 部署到 Cloudflare
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        working-directory: ./src/mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy -c wrangler-deploy.toml

      - name: 升级数据库结构与配置
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SITE_URL: ${{ env.SITE }}
        run: |
          sleep 10
          BODY=$(curl -sL --max-time 120 "$SITE_URL/api/init/${JWT_SECRET}")
          echo "init 返回：${BODY:0:200}"
          if [ "$BODY" != "success" ]; then
            echo "::error::数据库初始化失败，注意 /api/init 内部失败会被 try/catch 吞掉，必须看下一步校验结果"
            exit 1
          fi

      - name: 校验站点可用
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        env:
          SITE_URL: ${{ env.SITE }}
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
            echo "首页 HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "站点不可用"
          exit 1

      - name: 校验表结构已升级
        if: steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          q() {
            jq -cn --arg sql "$1" '{sql:$sql}' \
              | curl -s -X POST \
                  "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database/$DB_ID/query" \
                  -H "Authorization: Bearer $CF_TOKEN" \
                  -H 'Content-Type: application/json' --data @- \
              | jq -r '[.result[0].results[]? | .name] | join(" ")'
          }
          SETTING="$(q "SELECT name FROM pragma_table_info('setting')")"
          EMAIL="$(q "SELECT name FROM pragma_table_info('email')")"
          IDX="$(q "SELECT name FROM sqlite_master WHERE type='index'")"
          fail=0
          for col in sync_delete webhook_url auto_clean_days; do
            grep -qw "$col" <<< "$SETTING" || { echo "缺字段 setting.$col"; fail=1; }
          done
          for col in code sender_email; do
            grep -qw "$col" <<< "$EMAIL" || { echo "缺字段 email.$col"; fail=1; }
          done
          for idx in idx_email_create_time idx_email_list_user; do
            grep -qw "$idx" <<< "$IDX" || { echo "缺索引 $idx"; fail=1; }
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::表结构没有完整升级，需要手工补：wrangler d1 execute dqdd --remote --command='...'"
            exit 1
          fi
          echo "表结构校验通过"

      - name: 标记该版本已上线
        if: success() && steps.gate.outputs.need == 'true' && inputs.skip_deploy != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/deployed-$TAG" -f sha="$SHA"
          echo "已标记 deployed-$TAG"
